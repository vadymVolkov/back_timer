<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обратный Таймер | Countdown Timer</title>
  <meta name="description" content="Минималистичный обратный таймер для отсчета времени до вашего события в режиме реального времени.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%228%22/><polyline points=%2250,20 50,50 70,65%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%228%22 stroke-linecap=%22round%22/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Top Header Bar with Language Switcher -->
    <header class="top-bar">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language selection">
        <button type="button" class="lang-btn active" data-lang="ru">RU</button>
        <span class="lang-divider">/</span>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <!-- Section 1: Event Creation Form (Shown when no active event) -->
      <section id="formSection" class="card-section animate-fade-in">
        <div class="form-header">
          <h1 id="createTitle" class="form-title">Новое событие</h1>
          <p id="createSubtitle" class="form-subtitle">Укажите событие и дату, чтобы начать отсчет</p>
        </div>

        <form id="eventForm" novalidate>
          <div class="input-group">
            <label for="eventTitleInput" id="eventTitleLabel" class="input-label">Название события</label>
            <input 
              type="text" 
              id="eventTitleInput" 
              class="input-field" 
              placeholder="Например: Новый Год или Отпуск" 
              required 
              maxlength="60"
              autocomplete="off"
            >
          </div>

          <div class="input-group">
            <label for="eventDateTimeInput" id="dateTimeLabel" class="input-label">Дата и время события</label>
            <input 
              type="datetime-local" 
              id="eventDateTimeInput" 
              class="input-field date-input" 
              required
            >
          </div>

          <!-- Quick Presets -->
          <div class="presets-container">
            <span id="presetsLabel" class="presets-title">Быстрый выбор:</span>
            <div class="preset-chips">
              <button type="button" class="chip-btn" id="presetNewYearBtn">🎉 Новый Год</button>
              <button type="button" class="chip-btn" id="presetSummerBtn">☀️ Лето</button>
              <button type="button" class="chip-btn" id="presetIn24hBtn">⏱️ +24 часа</button>
            </div>
          </div>

          <div id="formError" class="error-msg" aria-live="polite"></div>

          <button type="submit" id="submitBtn" class="primary-btn">
            <span>Запустить отсчет</span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>
      </section>

      <!-- Section 2: Active Countdown View (Shown when event exists) -->
      <section id="countdownSection" class="countdown-section hidden animate-fade-in">
        <div class="countdown-wrapper">
          <div class="until-label-container">
            <span id="untilText" class="until-text">до</span>
            <h1 id="activeEventTitle" class="event-title-display"></h1>
          </div>

          <!-- Timer digits display -->
          <div id="timerDisplay" class="timer-grid">
            <div class="timer-unit">
              <span id="daysValue" class="timer-num">00</span>
              <span id="daysLabel" class="timer-sub">дней</span>
            </div>
            <span class="timer-colon">:</span>
            <div class="timer-unit">
              <span id="hoursValue" class="timer-num">00</span>
              <span id="hoursLabel" class="timer-sub">часов</span>
            </div>
            <span class="timer-colon">:</span>
            <div class="timer-unit">
              <span id="minutesValue" class="timer-num">00</span>
              <span id="minutesLabel" class="timer-sub">минут</span>
            </div>
            <span class="timer-colon">:</span>
            <div class="timer-unit highlight-seconds">
              <span id="secondsValue" class="timer-num pulse-seconds">00</span>
              <span id="secondsLabel" class="timer-sub">секунд</span>
            </div>
          </div>

          <!-- Completion Banner (hidden by default) -->
          <div id="eventCompletedBanner" class="completed-banner hidden">
            <div class="completed-badge" id="eventReachedText">🎉 Событие наступило!</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Subtle Footer Action (Cancel Event button - non-intrusive) -->
    <footer class="bottom-bar">
      <button type="button" id="cancelBtn" class="cancel-btn hidden" title="Отменить событие">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span id="cancelBtnText">Отменить событие</span>
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
